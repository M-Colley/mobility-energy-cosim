name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CityLearn with the external-mobility hook. Replace by "citylearn>=X.Y" once the hook is released.
  CITYLEARN_SPEC: "citylearn @ git+https://github.com/M-Colley/CityLearn@feat/external-mobility-provider"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.5"  # same version as used for development (also formats Markdown code blocks)
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # CityLearn dataset downloads use the GitHub API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (SUMO from the eclipse-sumo wheel, CPU-only torch for CityLearn)
        run: |
          python -m pip install --upgrade pip
          pip install eclipse-sumo
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ env.CITYLEARN_SPEC }}"
          pip install -e ".[dev]"
        shell: bash
      - name: Versions
        run: mecosim info
      - name: Tests
        run: pytest -q -ra
