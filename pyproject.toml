[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mobility-energy-cosim"
version = "0.1.0"
description = "Co-simulation of automated electric vehicles that carry energy across a city: SUMO mobility, CityLearn energy, dispatch policies and Pareto analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Colley" }]
requires-python = ">=3.10"
keywords = ["co-simulation", "vehicle-to-grid", "V2G", "SUMO", "CityLearn", "automated vehicles", "energy", "mobility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "eclipse-sumo>=1.24",
    "sumolib>=1.24",
    "traci>=1.24",
    "libsumo>=1.24",
]

[project.optional-dependencies]
# CityLearn with the external-mobility hook. Until it is released, CI installs it from git (see .github/workflows/ci.yml).
citylearn = ["citylearn", "pyarrow>=15"]
rl = ["gymnasium>=1.0", "pettingzoo>=1.24"]
mosaik = ["mosaik-api-v3>=3.0"]
analysis = ["pymoo>=0.6.1", "matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "mosaik-api-v3>=3.0",
    "pymoo>=0.6.1",
    "matplotlib>=3.7",
]

[project.scripts]
mecosim = "mecosim.cli:main"

[project.urls]
Homepage = "https://github.com/M-Colley/mobility-energy-cosim"
Issues = "https://github.com/M-Colley/mobility-energy-cosim/issues"

[tool.hatch.build.targets.wheel]
packages = ["mecosim"]

[tool.hatch.build.targets.sdist]
include = ["mecosim", "tests", "docs", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["runs", "examples/**/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sumo: needs SUMO (eclipse-sumo wheel)",
    "citylearn: needs CityLearn with the external-mobility hook",
    "slow: longer integration runs",
]
filterwarnings = ["ignore::DeprecationWarning:pettingzoo.*"]
